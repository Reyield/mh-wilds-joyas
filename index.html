<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Códice de Joyas - MH Wilds</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- Variables de Color Temáticas --- */
        :root {
            --mh-bg-dark: #1a1512;       /* Fondo principal oscuro */
            --mh-paper: #cbb995;         /* Color pergamino para el texto base */
            --mh-leather-dark: #2e221b;  /* Fondo de las tarjetas */
            --mh-gold: #cba75e;          /* Títulos y bordes dorados */
            --mh-gold-hover: #e3c687;    /* Dorado más brillante al pasar el mouse */
            --mh-accent-red: #8a2c21;    /* Color para los slots */
            --mh-border-frame: #4a3c31;  /* Bordes gruesos */
        }

        body {
            font-family: 'Spectral', serif;
            background-color: var(--mh-bg-dark);
            /* Un degradado sutil para dar textura de fondo */
            background-image: radial-gradient(circle at center, #2a201a 0%, #1a1512 100%);
            color: var(--mh-paper);
            padding: 20px;
            min-height: 100vh;
        }

        .main-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--mh-leather-dark);
            border: 4px solid var(--mh-border-frame);
            /* Sombra interna para efecto de profundidad */
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 5px 15px rgba(0,0,0,0.5);
            padding: 25px;
            border-radius: 4px;
            position: relative;
        }

        /* Decoración de esquina (opcional, solo CSS) */
        .main-container::before, .main-container::after {
            content: '';
            position: absolute;
            width: 20px; height: 20px;
            border: 3px solid var(--mh-gold);
        }
        .main-container::before { top: 5px; left: 5px; border-right: none; border-bottom: none; }
        .main-container::after { bottom: 5px; right: 5px; border-left: none; border-top: none; }


        h1 {
            font-family: 'Cinzel Decorative', cursive;
            color: var(--mh-gold);
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            border-bottom: 2px solid var(--mh-border-frame);
            padding-bottom: 15px;
        }

        /* Estilo del buscador */
        #search-container {
            position: relative;
            margin-bottom: 25px;
        }

        #search-box {
            width: 100%;
            padding: 15px 20px;
            font-size: 1.1em;
            background: #0f0c0a; /* Muy oscuro */
            border: 2px solid var(--mh-border-frame);
            color: var(--mh-gold);
            font-family: 'Spectral', serif;
            border-radius: 4px;
            outline: none;
            box-sizing: border-box; /* Para que el padding no afecte el ancho */
            transition: border-color 0.3s;
        }

        #search-box:focus {
            border-color: var(--mh-gold);
            box-shadow: 0 0 10px rgba(203, 167, 94, 0.3);
        }

        #search-box::placeholder {
            color: rgba(203, 185, 149, 0.5);
            font-style: italic;
        }

        /* Estilo de las tarjetas de resultados */
        .card {
            background: rgba(46, 34, 27, 0.8); /* Color cuero semitransparente */
            border: 1px solid var(--mh-border-frame);
            border-left: 4px solid var(--mh-gold); /* Acento dorado a la izquierda */
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, background 0.2s;
        }

        .card:hover {
            transform: translateY(-2px);
            background: rgba(60, 45, 35, 0.9);
            border-left-color: var(--mh-gold-hover);
        }
        
        .card-info {
            flex-grow: 1;
        }

        .card-header {
            font-family: 'Cinzel Decorative', cursive;
            font-weight: bold;
            color: var(--mh-gold);
            font-size: 1.2em;
            margin-bottom: 5px;
        }
        
        .card-header small {
            color: #8c7b65;
            font-family: 'Spectral', serif;
            font-size: 0.8em;
            margin-left: 5px;
        }

        .card-sub {
            font-size: 0.95em;
            line-height: 1.4;
        }
        
        .card-sub strong {
            color: #a89478;
        }

        .slot-badge { 
            background: var(--mh-accent-red);
            color: var(--mh-paper);
            padding: 8px 12px;
            border: 2px solid var(--mh-border-frame);
            font-family: 'Cinzel Decorative', cursive;
            font-weight: bold;
            border-radius: 2px; /* Bordes más rectos, menos "web 2.0" */
            box-shadow: inset 0 0 5px rgba(0,0,0,0.5);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
            min-width: 60px;
            text-align: center;
        }
        
        #results p {
             text-align: center;
             font-style: italic;
             color: #8c7b65;
        }
    </style>
</head>
<body>

<div class="main-container">
    <h1>📜 Códice de Decoraciones</h1>
    <div id="search-container">
        <input type="text" id="search-box" placeholder="🔍 Escribe el nombre de la joya o habilidad...">
    </div>
    <div id="results">
        <p>Consultando los archivos del gremio...</p>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

<script>
    // --- PEGA TU ENLACE CSV AQUÍ ---
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-Ya88p8JushYSrm-tvNCIBjzclNAmKvcuTAeiAcEY2VmJQIsnXBo1hTjCJFQoFaDkvkZTl9_jodih/pub?gid=1329202997&single=true&output=csv'; 
    // -------------------------------

    let allJewels = [];
    const resultsDiv = document.getElementById('results');

    Papa.parse(sheetUrl, {
        download: true,
        header: true,
        complete: function(results) {
            allJewels = results.data;
            // Limpiamos los datos de filas vacías si las hubiera
            allJewels = allJewels.filter(item => item['Joya (Español)'] && item['Joya (Español)'].trim() !== '');
            renderList(allJewels);
        },
        error: function(err) {
            resultsDiv.innerHTML = '<p style="color: #d9534f;">Error al cargar los datos. Verifica el enlace CSV.</p>';
            console.error("Error de PapaParse:", err);
        }
    });

    const searchInput = document.getElementById('search-box');

    searchInput.addEventListener('keyup', (e) => {
        const term = e.target.value.toLowerCase();
        
        const filtered = allJewels.filter(item => {
            const nombreEsp = item['Joya (Español)']?.toLowerCase() || '';
            const nombreIng = item['Joya (Ingles)']?.toLowerCase() || '';
            const skill = item['Skill (Ingles)']?.toLowerCase() || '';
            const habilidad = item['Habilidad (Español)']?.toLowerCase() || '';

            return nombreEsp.includes(term) || 
                   nombreIng.includes(term) || 
                   skill.includes(term) ||
                   habilidad.includes(term);
        });

        renderList(filtered);
    });

    function renderList(data) {
        if(data.length === 0) {
            resultsDiv.innerHTML = '<p>No se encontraron registros en el códice.</p>';
            return;
        }

        const html = data.map(item => {
            // Lógica simple para acortar el texto del slot si es muy largo
            let slotText = item['Slot level'] || 'N/A';
            if (slotText.includes("Slot")) {
                slotText = slotText.replace("Slot", "Nivel");
            }

            return `
            <div class="card">
                <div class="card-info">
                    <div class="card-header">${item['Joya (Español)']} <small>${item['Joya (Ingles)']}</small></div>
                    <div class="card-sub">
                        <strong>Habilidad:</strong> ${item['Habilidad (Español)']} <br>
                        <strong>Tipo:</strong> ${item['Type']}
                    </div>
                </div>
                <div class="slot-badge">${slotText}</div>
            </div>
        `}).join('');

        resultsDiv.innerHTML = html;
    }
</script>

</body>
</html>
