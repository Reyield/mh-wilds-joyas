<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gremio de Cazadores - Archivo de Joyas</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --gold: #d4af37;
            --gold-dim: #8a7326;
            --blue-orb: #29b6f6;
            --gold-orb: #ffd54f;
            --grey-orb: #9e9e9e;
            --accent-red: #8a2c21;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            padding: 20px;
            margin: 0;
            background-image: radial-gradient(circle at top, #1f1f1f 0%, #121212 100%);
            min-height: 100vh;
        }

        .container { max-width: 800px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 3px solid var(--gold-dim);
            padding-bottom: 15px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            margin: 0;
            font-size: 1.6em;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* TOGGLE */
        .toggle-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 54px;
            height: 28px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333;
            transition: .4s;
            border-radius: 4px;
            border: 2px solid var(--gold-dim);
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: var(--gold);
            transition: .4s;
            border-radius: 2px;
        }
        input:checked + .slider { background-color: #2e260e; }
        input:checked + .slider:before { transform: translateX(26px); }

        /* BUSCADOR */
        #search-box {
            width: 100%;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--gold-dim);
            color: var(--gold);
            border-radius: 4px;
            font-size: 1.1em;
            margin-bottom: 25px;
            box-sizing: border-box;
            font-family: 'Cinzel', serif;
        }
        #search-box:focus { outline: 2px solid var(--gold); border-color: transparent; }

        /* TARJETAS */
        .card {
            background: var(--card-bg);
            border: 1px solid #333;
            border-left: 5px solid var(--gold);
            padding: 15px 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-2px); border-left-color: #ffe082; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .jewel-name {
            font-family: 'Cinzel', serif;
            font-size: 1.3em;
            color: var(--gold);
            text-decoration: none;
            border-bottom: 1px dotted var(--gold-dim);
        }
        .jewel-name:hover { color: #fff; border-bottom: 1px solid #fff; }

        .meta-tags {
            display: flex;
            gap: 10px;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            margin-bottom: 12px;
        }
        .meta-tag {
            background: #2a2a2a;
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid #444;
        }

        .skill-text {
            font-size: 1.05em;
            color: #eee;
            margin-bottom: 15px;
            padding-left: 10px;
            border-left: 2px solid #444;
        }

        /* ORBES CON IMAGEN */
        .orb-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px; /* Más espacio entre grupos de orbes */
            padding-top: 10px;
            border-top: 1px solid #333;
        }
        .orb-badge {
            display: inline-flex;
            align-items: center;
            font-size: 0.9em;
            color: #ccc;
            gap: 8px; /* Espacio entre imagen y texto */
        }
        .orb-img {
            width: 24px;
            height: 24px;
            border-radius: 4px; /* Un poco cuadrado, estilo inventario */
            object-fit: contain;
            background: rgba(0,0,0,0.5); /* Fondo oscuro por si la imagen es transparente */
            border: 1px solid #444;
        }
        
        /* Colores de texto según tipo (opcional, para mantener la lógica de colores) */
        .text-armor { color: var(--blue-orb); }
        .text-weapon { color: var(--gold-orb); }
        .text-mystery { color: var(--grey-orb); }

    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>💎 MH Wilds DB</h1>
        <div class="toggle-wrapper">
            <span id="label-en" style="color: var(--gold);">ENG</span>
            <label class="switch">
                <input type="checkbox" id="lang-toggle">
                <span class="slider"></span>
            </label>
            <span id="label-es" style="color: #666;">ESP</span>
        </div>
    </header>

    <input type="text" id="search-box" placeholder="Buscar joya o habilidad... / Search jewel...">
    <div id="results">
        <p style="text-align: center; color: #666;">Cargando códice...</p>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

<script>
    // ----------------------------------------------------
    // ASEGÚRATE DE QUE ESTE ENLACE ESTÁ ACTUALIZADO
    const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-Ya88p8JushYSrm-tvNCIBjzclNAmKvcuTAeiAcEY2VmJQIsnXBo1hTjCJFQoFaDkvkZTl9_jodih/pub?gid=1329202997&single=true&output=csv'; 
    // ----------------------------------------------------

    let allJewels = [];
    let isSpanish = false;

    const resultsDiv = document.getElementById('results');
    const searchInput = document.getElementById('search-box');
    const toggle = document.getElementById('lang-toggle');
    const labelEn = document.getElementById('label-en');
    const labelEs = document.getElementById('label-es');

    Papa.parse(sheetUrl, {
        download: true,
        header: true,
        complete: function(results) {
            allJewels = results.data.filter(i => i['Joya (Ingles)'] && i['Joya (Ingles)'].trim() !== '');
            renderList(allJewels);
        },
        error: function(err) {
            resultsDiv.innerHTML = '<p style="color: red; text-align: center;">Error al leer datos.</p>';
        }
    });

    toggle.addEventListener('change', (e) => {
        isSpanish = e.target.checked;
        if(isSpanish) {
            labelEs.style.color = 'var(--gold)';
            labelEn.style.color = '#666';
        } else {
            labelEn.style.color = 'var(--gold)';
            labelEs.style.color = '#666';
        }
        triggerSearch();
    });

    searchInput.addEventListener('keyup', triggerSearch);

    function triggerSearch() {
        const term = searchInput.value.toLowerCase();
        const filtered = allJewels.filter(item => {
            const esName = (item['Joya (Español)'] || '').toLowerCase();
            const enName = (item['Joya (Ingles)'] || '').toLowerCase();
            const esSkill = (item['Habilidad (Español)'] || '').toLowerCase();
            const enSkill = (item['Skill (Ingles)'] || '').toLowerCase();
            return esName.includes(term) || enName.includes(term) || 
                   esSkill.includes(term) || enSkill.includes(term);
        });
        renderList(filtered);
    }

    // Auxiliar para color del texto
    function getOrbColorClass(orbName) {
        if(!orbName) return 'text-mystery';
        const lower = orbName.toLowerCase();
        if(lower.includes('armor')) return 'text-armor';
        if(lower.includes('sword') || lower.includes('weapon')) return 'text-weapon';
        return 'text-mystery';
    }

    function renderList(data) {
        if(data.length === 0) {
            resultsDiv.innerHTML = '<p style="text-align: center; color: #888;">No results.</p>';
            return;
        }

        const html = data.map(item => {
            const name = isSpanish ? (item['Joya (Español)'] || item['Joya (Ingles)']) : item['Joya (Ingles)'];
            const skill = isSpanish ? (item['Habilidad (Español)'] || item['Skill (Ingles)']) : item['Skill (Ingles)'];
            const type = item['Type'] || 'Decoration';
            const slot = item['Slot level'] || 'Slot ?';
            const link = item['Link'] || '#';

            // Datos de Orbes (Texto + Imagen)
            const orbText1 = item['Orbe donde se obtiene'];
            const orbImg1  = item['ImgOrb1']; // Nueva columna del script
            
            const orbText2 = item['Otro orbe donde se obtiene'];
            const orbImg2  = item['ImgOrb2']; // Nueva columna del script

            let orbsHtml = '';

            // Orbe 1
            if(orbText1) {
                const colorClass = getOrbColorClass(orbText1);
                // Si hay imagen, la usa. Si no, usa un icono por defecto
                const imgTag = orbImg1 ? `<img src="${orbImg1}" class="orb-img" alt="icon">` : '<span style="font-size:20px">💎</span>';
                
                orbsHtml += `<div class="orb-badge ${colorClass}">
                                ${imgTag} 
                                <span>${orbText1}</span>
                             </div>`;
            }

            // Orbe 2
            if(orbText2) {
                const colorClass = getOrbColorClass(orbText2);
                const imgTag = orbImg2 ? `<img src="${orbImg2}" class="orb-img" alt="icon">` : '<span style="font-size:20px">💎</span>';
                
                orbsHtml += `<div class="orb-badge ${colorClass}">
                                ${imgTag}
                                <span>${orbText2}</span>
                             </div>`;
            }

            return `
            <div class="card">
                <div class="card-header">
                    <a href="${link}" target="_blank" class="jewel-name">${name} ↗</a>
                </div>
                <div class="meta-tags">
                    <span class="meta-tag">${type}</span>
                    <span class="meta-tag" style="color: var(--accent-red); border-color: var(--accent-red);">${slot}</span>
                </div>
                <div class="skill-text">${skill}</div>
                <div class="orb-container">${orbsHtml}</div>
            </div>
            `;
        }).join('');

        resultsDiv.innerHTML = html;
    }
</script>

</body>
</html>
